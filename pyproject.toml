[project]
name = "grok-mcp"
version = "1.0.1"
description = "MCP server for the xAI Grok API — image generation, vision, chat, reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["grok", "xai", "mcp", "ai", "image-generation", "model-context-protocol"]

dependencies = [
    # <2: server.py and tools/models.py use FastMCP internals (_tool_manager); recheck on upgrade.
    "mcp>=1.30.0,<2",
    "openai>=1.0.0,<3",
    "xai-sdk>=1.20",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.32.0",  # init_size (db.init_db)
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.7",  # TypedDict that pydantic accepts on Python 3.11
]

[project.scripts]
grok-mcp = "grok_mcp.__main__:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src"]

[tool.pdm.dev-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1",
]
