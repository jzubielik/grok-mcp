name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*.*.*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate \
                       | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                       | grep -v "^${VERSION}$" \
                       | head -1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          RANGE="${RANGE:-HEAD}"
          printf '## Changes\n\n' > /tmp/release_notes.md
          git log "${RANGE}" --pretty="format:- %s (%h)" --no-merges >> /tmp/release_notes.md

      # The runner ships gh; it authenticates with GH_TOKEN, not with the checkout credentials.
      - name: Create release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
