name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
  # New advisories appear without a commit: re-run the dependency audit and the image scan.
  schedule:
    - cron: "17 6 * * 1"

env:
  # Pinned by digest; bump tag and digest together (.pre-commit-config.yaml pins the same ones).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install "pdm[locked]==2.29.0"
          pdm install -G test -G dev
      - name: Test
        run: pdm run pytest

  # The same hooks a commit runs locally (ruff, pip-audit, hadolint, actionlint, zizmor, secret
  # scanners), on every file — so a commit made without `make hooks` or with --no-verify still
  # fails here.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "pdm[locked]==2.29.0"
          pdm install -G dev
      - name: pre-commit
        # gitleaks there scans staged changes only; the full history is the `secrets` job.
        run: SKIP=gitleaks pdm run pre-commit run --all-files --show-diff-on-failure

  # Full-history scans; both fail the job on any finding (trufflehog: verified or unknown).
  # GitHub push protection rejects known provider tokens before they land; this catches the rest.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner
      - name: trufflehog
        run: >-
          docker run --rm -v "$PWD:/repo" "$TRUFFLEHOG_IMAGE"
          git file:///repo --results=verified,unknown --fail --no-update

  # Builds the image the way Publish does (without pushing) and scans it, so a broken Dockerfile
  # or a fixable HIGH/CRITICAL vulnerability fails the PR instead of the release.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: grok-mcp:ci
          cache-from: type=gha
      - name: trivy config
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE"
          config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: trivy image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed grok-mcp:ci
