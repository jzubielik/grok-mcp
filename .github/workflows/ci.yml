name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install pdm==2.29.0
          pdm install -G test -G dev
      - name: Lint
        run: |
          pdm run ruff check src tests
          pdm run ruff format --check src tests
      - name: Test
        run: pdm run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Full-history scans; both fail the job on any finding (trufflehog: verified or unknown).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner
      - name: trufflehog
        run: >-
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.90.8
          git file:///repo --results=verified,unknown --fail --no-update
