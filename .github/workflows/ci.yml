name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install pdm==2.29.0
          pdm install -G test -G dev
      - name: Lint
        run: |
          pdm run ruff check src tests
          pdm run ruff format --check src tests
      - name: Test
        run: pdm run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Full-history scans; both fail the job on any finding (trufflehog: verified or unknown).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner
      - name: trufflehog
        run: >-
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.90.8
          git file:///repo --results=verified,unknown --fail --no-update
