# Bumps the SHA-pinned actions (keeping the `# vX.Y.Z` comment) and the digest-pinned base images.
# Python dependencies are not covered — Dependabot does not read pdm.lock; `make audit`
# (pip-audit, in the pre-commit hooks and the weekly CI run) checks them instead.
# The scanner images pinned in ci.yml and .pre-commit-config.yaml are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # A new Python line is a deliberate change: the CI test matrix (3.11, 3.12) moves with it.
      # New digests of 3.12-slim (security fixes) still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # A new major cannot read the old data directory (and postgres:18 moved PGDATA): upgrading
      # takes a dump/restore or pg_upgrade, never a tag bump. New 17-bookworm digests still come.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
