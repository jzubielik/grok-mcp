# Bumps the SHA-pinned actions (keeping the `# vX.Y.Z` comment) and the digest-pinned base images.
# Python dependencies are not covered — Dependabot does not read pdm.lock; `make audit`
# (pip-audit, in the pre-commit hooks and the weekly CI run) checks them instead.
# The scanner images pinned in ci.yml and .pre-commit-config.yaml are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
